plugins {
  id 'net.fabricmc.fabric-loom' version "${loom_version}"
  id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
  archivesName = project.archives_base_name
}

repositories {
  maven {
    url = "https://masa.dy.fi/maven/sakura-ryoko"
    content { includeGroupAndSubgroups("fi.dy.masa") }
  }
  maven {
    url = "https://maven.fallenbreath.me/releases"
    content { includeGroupAndSubgroups("me.fallenbreath") }
  }
  // ModMenu jars on terraformersmc.com have been truncating mid-download;
  // Modrinth mirrors the same 21.0.0 artifact reliably.
  maven { url = "https://api.modrinth.com/maven" }
}

loom {
  splitEnvironmentSourceSets()

  mods {
    "mobwalk" {
      sourceSet sourceSets.main
      sourceSet sourceSets.client
    }
  }

}

dependencies {
  // To change the versions see the gradle.properties file
  minecraft "com.mojang:minecraft:${project.minecraft_version}"

  implementation "net.fabricmc:fabric-loader:${project.loader_version}"

  // Fabric API. This is technically optional, but you probably want it anyway.
  implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

  // MaLiLib (settings screen + config options). Plain implementation — this loom
  // uses official 26.3 mappings (non-remapping), same as fabric-api above.
  implementation "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"

  // ModMenu (Configure button). compileOnly for the API; localRuntime so
  // runClient shows Mods → Configure without bundling ModMenu into the jar.
  // Resolved from Modrinth (see repositories) — terraformersmc.com truncates.
  compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
  localRuntime "maven.modrinth:modmenu:${project.modmenu_version}"

  // Pure-logic unit tests (the surface geometry: rect ops, edge classification,
  // headroom predicate). fabric-loader-junit boots the transforming classloader
  // so client classes load in tests.
  testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
  testImplementation "org.junit.jupiter:junit-jupiter-params:5.11.4"
}

// The geometry under test lives in the client source set (splitEnvironmentSourceSets),
// so the test source set must compile/run against it, and the Minecraft jars must be on
// the test classpath or fabric-loader-junit's game provider can't locate the game.
// See FabricMC/fabric-loom#1060.
sourceSets {
  test {
    compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
    runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
  }
}

configurations {
  testCompileClasspath.extendsFrom(minecraftCommonNamedCompile)
  testRuntimeClasspath.extendsFrom(minecraftCommonNamedRuntime)
  testCompileClasspath.extendsFrom(minecraftClientOnlyNamedCompile)
  testRuntimeClasspath.extendsFrom(minecraftClientOnlyNamedRuntime)
  testRuntimeClasspath.extendsFrom(modRuntimeClasspathClientMapped)
}

test {
  useJUnitPlatform()
}

processResources {
  def version = project.version
  inputs.property "version", version

  filesMatching("fabric.mod.json") {
    expand "version": version
  }
}

tasks.withType(JavaCompile).configureEach {
  it.options.release = 25
}

java {
  // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
  // if it is present.
  // If you remove this line, sources will not be generated.
  withSourcesJar()

  sourceCompatibility = JavaVersion.VERSION_25
  targetCompatibility = JavaVersion.VERSION_25
}

jar {
  def projectName = project.name
  inputs.property "projectName", projectName

  from("LICENSE") {
    rename { "${it}_$projectName"}
  }
}

// configure the maven publication
publishing {
  publications {
    create("mavenJava", MavenPublication) {
      from components.java
    }
  }

  // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
  repositories {
    // Add repositories to publish to here.
    // Notice: This block does NOT have the same function as the block in the top level.
    // The repositories here will be used for publishing your artifact, not for
    // retrieving dependencies.
  }
}
